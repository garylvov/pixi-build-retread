name: release

# On a version tag (v*): build the retread conda package from recipe/ with
# rattler-build and publish it to prefix.dev.
#
# Publishing requires the repository secret PREFIX_API_KEY (a prefix.dev API
# key; rattler-build reads it from the PREFIX_API_KEY env var). If the secret
# is not set, the build still runs and the package is uploaded as a workflow
# artifact, but the publish step is skipped with a notice instead of failing.

on:
  push:
    tags: ['v*']
  # Manual runs (builds whatever ref is selected, default branch by default).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publish:
    name: rattler-build + publish to prefix.dev
    runs-on: ubuntu-24.04
    env:
      # https://prefix.dev/channels/garylvov/packages/pixi-build-retread
      PREFIX_CHANNEL: garylvov
      HAS_PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY != '' }}
      RATTLER_BUILD_VERSION: '0.69.0'
      RATTLER_BUILD_SHA256: 55ace96f0515f43273fec18307fbcb8c03ed8d6d90039494c65a39f7f0591d4a
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pin both the release and its published digest. The statically linked
      # musl binary runs on any x86_64 Linux runner.
      - name: Install verified rattler-build
        run: |
          set -euo pipefail
          asset=rattler-build-x86_64-unknown-linux-musl
          url="https://github.com/prefix-dev/rattler-build/releases/download/v${RATTLER_BUILD_VERSION}/${asset}"
          curl --fail --location --silent --show-error --output rattler-build "$url"
          printf '%s  %s\n' "$RATTLER_BUILD_SHA256" rattler-build | sha256sum --check --strict
          sudo install -m 0755 rattler-build /usr/local/bin/rattler-build
          test "$(rattler-build --version)" = "rattler-build ${RATTLER_BUILD_VERSION}"

      # recipe/recipe.yaml bootstraps its own rust toolchain via rustup inside
      # the build sandbox (see comments there); recipe/variants.yaml sits next
      # to it and is picked up automatically.
      - name: Build conda package
        run: rattler-build build --recipe recipe/recipe.yaml --output-dir output

      # Keep the package around even when publishing is skipped or fails.
      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conda-package
          path: output/**/*.conda
          if-no-files-found: error

      - name: Publish to prefix.dev
        if: env.HAS_PREFIX_API_KEY == 'true'
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          packages=(output/**/*.conda)
          test "${#packages[@]}" -eq 1
          rattler-build upload prefix --skip-existing --channel "$PREFIX_CHANNEL" "${packages[@]}"

      - name: Publish skipped (no PREFIX_API_KEY secret)
        if: env.HAS_PREFIX_API_KEY != 'true'
        run: |
          echo "::warning::PREFIX_API_KEY secret is not set; skipping publish to prefix.dev." \
               "The built package is available as the 'conda-package' workflow artifact."
