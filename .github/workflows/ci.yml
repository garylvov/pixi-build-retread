name: linux-x86_64

# Build + fast test suite, a non-blocking fmt/clippy lint job, the musl
# static-link guard, and the EMIT_EPOCH guard. Heavy live/e2e tests
# (#[ignore]'d: isaacsim, py.mujoco.org, e2e_ros_isaacsim) are NOT run here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # edition 2024 needs Rust >= 1.85; pinned exact version below (kept in
      # sync with rust-toolchain.toml) so CI and local fmt/clippy never drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      # Cache the cargo registry, git deps (pixi/uv/pubgrub), and the build
      # so build+test don't recompile ~200 crates from scratch every run.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets

      # Known-flaky / host-dependent tests are excluded from the parallel run
      # rather than serializing the whole suite with --test-threads=1:
      #   - materialize_index_wheel_fetches_locked_url_and_verifies_hash:
      #     sha-addressed-cache env race (cache-dir env vars are
      #     process-global; parallel tests stomp each other's cache dir).
      #   - initialize_preflight_repairs_dangling_pixi_bld_symlink_target:
      #     host-dependent symlink layout assumptions.
      #   - handler::incremental_add_tests::*: flaky when run in parallel
      #     (env-var based); re-run serially in the next step.
      # Heavy live-network tests stay behind #[ignore] and are not run.
      - name: Test (fast suite, flaky tests excluded)
        run: >
          cargo test --locked --all-targets --
          --skip materialize_index_wheel_fetches_locked_url_and_verifies_hash
          --skip initialize_preflight_repairs_dangling_pixi_bld_symlink_target
          --skip incremental_add

      # The incremental_add suite is only flaky under parallel execution;
      # run it single-threaded so its coverage is kept.
      - name: Test (incremental_add suite, serial)
        run: cargo test --locked --lib incremental_add -- --test-threads=1

  # fmt + clippy, NON-BLOCKING (continue-on-error): the current tree carries
  # a backlog of fmt drift and clippy lints (unused imports, too_many_arguments,
  # type_complexity, ...) from the v4 landing. Keeping this advisory surfaces
  # the signal without gating merges; flip continue-on-error off once the
  # backlog is cleaned up.
  lint:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: always()
        run: cargo clippy --all-targets -- -D warnings

  # The release artifact is a statically linked musl binary (v1.2.0+), so
  # it runs on any x86_64 Linux regardless of glibc version. This job
  # mirrors the recipe's build flags and fails if dynamic linking or
  # glibc symbol references ever sneak back in.
  musl-static:
    name: static musl build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # _FORTIFY_SOURCE emits glibc-only __memcpy_chk-style symbols in the
      # C objects (ring, zstd-sys) that musl lacks; disable it, same as
      # recipe/recipe.yaml.
      - name: Build statically linked binary
        env:
          CC_x86_64_unknown_linux_musl: gcc
          CFLAGS_x86_64_unknown_linux_musl: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Assert fully static (no dynamic linker, no glibc refs)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/pixi-build-retread
          ldd "$BIN" 2>&1 | grep -Eq 'statically linked|not a dynamic executable'
          if readelf -d "$BIN" | grep -qi needed; then
            echo "ERROR: binary has dynamic dependencies" >&2; exit 1
          fi

  # If a change can alter the BYTES retread emits for identical inputs, it must
  # bump lock::EMIT_EPOCH -- otherwise cold-solve replay reuses a stale lock and
  # the content-addressed conda build string doesn't move, so pixi links a stale
  # cached package. This guard fails when an emit-affecting source file changed
  # without EMIT_EPOCH being touched. Override with `[emit-epoch-ok]` in a commit
  # message when the change provably leaves emitted output unchanged.
  emit-epoch-guard:
    name: EMIT_EPOCH guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: EMIT_EPOCH bumped when emit-affecting code changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then base="${PR_BASE:-}"; else base="${PUSH_BEFORE:-}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable diff base ($base); skipping EMIT_EPOCH guard."; exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          # Files whose change can alter retread's emitted bytes for identical inputs.
          emit_re='^src/(relax|wheel_rewrite|wheel_inject|wheel_inject_data|emit_pypi|recipe|courier|lock)\.rs$|^src/handler/(auto_bundle|cascade)\.rs$'
          if ! echo "$changed" | grep -Eq "$emit_re"; then
            echo "no emit-affecting files changed; OK."; exit 0
          fi
          if git diff "$base" HEAD -- src/lock.rs | grep -Eq '^[-+].*EMIT_EPOCH'; then
            echo "emit-affecting code changed and EMIT_EPOCH was touched; OK."; exit 0
          fi
          if git log "${base}..HEAD" --format=%B | grep -qiF '[emit-epoch-ok]'; then
            echo "emit-affecting code changed; [emit-epoch-ok] override present; OK."; exit 0
          fi
          echo "::error::Emit-affecting files changed but src/lock.rs::EMIT_EPOCH was not bumped."
          echo "Bump EMIT_EPOCH in src/lock.rs (see its doc) so cold-solve replay + the"
          echo "content-addressed build string invalidate, OR add [emit-epoch-ok] to a"
          echo "commit message if the emitted output is provably unchanged."
          echo "Emit-affecting files changed:"
          echo "$changed" | grep -E "$emit_re"
          exit 1
