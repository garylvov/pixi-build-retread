name: linux-x86_64

# Runs the same pre-commit hooks contributors run locally: file hygiene,
# `cargo fmt --check`, `cargo clippy --all-targets -D warnings`, and the fast
# `cargo test --all-targets` suite. Heavy live/e2e tests (#[ignore]'d:
# isaacsim, py.mujoco.org, e2e_ros_isaacsim) are NOT run here.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # edition 2024 needs Rust >= 1.85; stable provides it. rustfmt +
      # clippy components are required by the cargo hooks.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache the cargo registry, git deps (pixi/uv/pubgrub), and the build
      # so clippy+test don't recompile ~200 crates from scratch every run.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python (for pre-commit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  # The release artifact is a statically linked musl binary (v1.2.0+), so
  # it runs on any x86_64 Linux regardless of glibc version. This job
  # mirrors the recipe's build flags and fails if dynamic linking or
  # glibc symbol references ever sneak back in.
  musl-static:
    name: static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # _FORTIFY_SOURCE emits glibc-only __memcpy_chk-style symbols in the
      # C objects (ring, zstd-sys) that musl lacks; disable it, same as
      # recipe/recipe.yaml.
      - name: Build statically linked binary
        env:
          CC_x86_64_unknown_linux_musl: gcc
          CFLAGS_x86_64_unknown_linux_musl: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Assert fully static (no dynamic linker, no glibc refs)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/pixi-build-retread
          ldd "$BIN" 2>&1 | grep -Eq 'statically linked|not a dynamic executable'
          if readelf -d "$BIN" | grep -qi needed; then
            echo "ERROR: binary has dynamic dependencies" >&2; exit 1
          fi
