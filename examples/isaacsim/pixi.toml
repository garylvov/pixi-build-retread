# Example: combine PyPI Isaac Sim with conda ROS 2 humble (the
# real-world scenario that motivates retread). Same conflict surface
# documented in prefix-dev/pixi#5230 -- without retread, the strict
# upstream pins in the isaacsim sub-wheels collide with conda's
# ros-humble-* dependency tree.
#
# This manifest is workspace-ONLY. The buildable retread package lives
# in ./isaacsim-pkg/ and is pulled into the default environment by the
# `isaacsim = { path = "./isaacsim-pkg" }` line under [dependencies]
# below (same split gigastrap uses: workspace here, package in a subdir).
#
# There is one environment (default). To smoke-test locally:
#   cd examples/isaacsim
#   pixi install                                # builds + solves both
#   pixi run python -c "import isaacsim, rclpy"

[workspace]
name = "isaacsim-ros2-demo"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-humble",
]
platforms = ["linux-64"]
preview = ["pixi-build"]

[system-requirements]
libc = "2.35"

# Conda-side runtime + ROS 2 humble, PLUS the retread source package.
# This is the dependency set that would conflict catastrophically with
# isaacsim's strict PyPI pins WITHOUT retread relaxing them. Compare to
# gigastrap's [feature.isaaclab.pypi-options.dependency-overrides] block
# (~16 entries) which exists solely to absorb those conflicts manually.
[dependencies]
isaacsim = { path = "./isaacsim-pkg" }
python = "==3.11"
ros-humble-ros-core = "*"
ros-humble-rviz2 = "*"
ros-humble-rosbag2 = "*"
ros-humble-xacro = "*"
ros-humble-joint-state-publisher = "*"
ros-humble-tf2-ros = "*"
colcon-common-extensions = "*"
colcon-ros = "*"
