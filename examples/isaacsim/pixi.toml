# Example: repack the isaacsim 5.1.0 metapackage with extras into a single
# conda source package, using retread's PyPI-style spec form. Compare to the
# 22-line hand-curated wheel URL list in pixi#5230 comment 24 -- one entry
# here expands the same set via the wheel's METADATA.
#
# To smoke-test locally:
#   cd examples/isaacsim
#   pixi install
#   pixi run python -c "import isaacsim; print(isaacsim.__version__)"

[workspace]
name = "isaacsim-repack-demo"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[package]
name = "isaacsim"
version = "5.1.0"

[build]
backend = { name = "pixi-build-retread", version = "*" }
channels = [
  "https://prefix.dev/garylvov",
  "https://prefix.dev/conda-forge",
]

[build.config]
relax = "minor"
build-number = 0

# Same syntax pixi uses for [pypi-dependencies]. retread resolves this
# against the PEP 503 simple index, then follows `extras` one level deep
# to pick up every `Requires-Dist: name ; extra == "X"` line in the
# wheel's METADATA.
[build.config.wheels]
isaacsim = { version = "==5.1.0", index = "https://pypi.nvidia.com", extras = ["all", "extscache"] }

[build.config.overrides]
# Keep numpy strictly <2 -- ros2-jazzy bindings still need it.
numpy = ">=1.26,<2"

[build.config.name-map]
# PyPI ships headless OpenCV as opencv-python-headless; conda calls it py-opencv.
opencv-python-headless = "py-opencv"
