#### GPU Environment-----------------------------------------------------------------------------
[feature.gpu]
# Channels would go here.

# Set CUDA_HOME for torch.compile/Triton to find ptxas
[feature.gpu.activation.env]
CUDA_HOME = "$CONDA_PREFIX"

# CUDA-enabled FFmpeg overlay. conda-forge's ffmpeg ships without
# --enable-cuda (NVENC SDK redistribution restrictions), so torchcodec's
# VideoDecoder(device="cuda") can't create an NVDEC hwdevice and silently
# falls back to CPU. cuda_ffmpeg.bash is source-or-execute: sourced on env
# activation, it downloads BtbN's pre-built ffmpeg-7.1 GPL shared build
# (~52 MB, ~30s) into third_party/ffmpeg-cuda/ on first run, then exports
# LD_PRELOAD so torchcodec resolves the CUDA-enabled libavcodec at runtime.
# (LD_PRELOAD, not LD_LIBRARY_PATH: pixi's python has DT_RPATH baked in
# that overrides LD_LIBRARY_PATH for its own env's lib dir; LD_PRELOAD is
# the only override that wins.) `pixi run setup-cuda-ffmpeg` invokes the
# same script for manual refresh / verification.
[feature.gpu.target.unix.activation]
scripts = ["scripts/cuda_ffmpeg.bash"]

[feature.gpu.tasks]
setup-cuda-ffmpeg = "bash scripts/cuda_ffmpeg.bash"

