[feature.gigastrap_sim_newton]
# IMPORTANT — known issues, gated by newton.bash at run time (NOT at activation):
#
# 1. usd-core 25.5 and usd-exchange 2.2.2 ship overlapping `pxr/Trace/_trace.so`
#    (and other pxr/*.so) files. uv installs in topological order: usd-core
#    (a transitive dep of usd-exchange) lands first, then usd-exchange
#    overwrites the shared paths with its own broken copy. usd-exchange
#    2.2.2's _trace.so bundles libtbb 2020.3 but FORGOT to bundle the
#    matching libtbbmalloc.so.2; libusd_tf's static init fails to resolve
#    `scalable_malloc` and aborts with `free(): invalid pointer`.
#
# 2. mujoco-warp and newton have malformed metadata (non-standard `index:`
#    syntax) that pixi/uv reject during resolution. They have to be
#    pip-installed manually.
#
# Both repairs live in `newton.bash` so the output is visible in the user's
# terminal (pixi swallows activation-script output). `pixi run -e gsn verify`
# is the smoke-test on a fresh clone.

# Override packages that have malformed (index: ...) syntax in their dependencies
[feature.gigastrap_sim_newton.pypi-options.dependency-overrides]
# See top-level [pypi-options.dependency-overrides] for why warp is pinned exact.
warp-lang = "==1.11.1" #"==1.11.0.dev20251205"
# Match the top-level mujoco cap. newton beta-0.2.1's _convert_to_mjc passes
# `stiffness` as a scalar, but mujoco 3.8 changed MjsBody.add_joint to expect
# `Optional[list[float]]` and rejects scalars with "stiffness should be a
# numeric scalar or list". Stay on the 3.5.x line until newton is bumped.
mujoco = ">=3.3.3,<3.6"
rerun-sdk = "*"

[feature.gigastrap_sim_newton.pypi-dependencies]
# Pre-install these before other packages resolve them with malformed index syntax.
# warp-lang exact-pinned -- newer versions removed `warp.context` which newton beta-0.2.1 imports.
warp-lang = { version = "==1.11.1",  index = "https://pypi.nvidia.com"} #"==1.11.0.dev20251205",
mujoco = { version = ">=3.3.3,<3.6", index = "https://py.mujoco.org" }
omniverseclient = { version = "*", index = "https://pypi.nvidia.com" }
# IsaacLab Newton packages -- editable installs handled in
# scripts/post-install-gigastrap-sim-newton.bash via `pip install -e
# --no-deps --force-reinstall`, AFTER the retread-bundled isaacsim
# conda package lands. Same reasoning as the PhysX block above: listing
# them here forces uv to read editable pyproject pins at solve time,
# which collides with whatever conda picks for shared transitives
# (pillow, starlette, ...). The post-install overlay swaps the code in
# site-packages without re-introducing the pins. Restore with:
#   sed -i 's/^# RETREAD: //' pixi.toml
# Note: mujoco-warp and newton have malformed metadata - they must be installed separately via:
#   pip install "mujoco-warp @ git+https://github.com/google-deepmind/mujoco_warp.git@e9a67538f2c14486121635074c5a5fd6ca55fa83"
#   pip install "newton @ git+https://github.com/newton-physics/newton.git@beta-0.2.1"
# isaaclab        = { path = "IsaacLabNewton/source/isaaclab", editable = true }
# isaaclab-assets = { path = "IsaacLabNewton/source/isaaclab_assets", editable = true }
# isaaclab-tasks  = { path = "IsaacLabNewton/source/isaaclab_tasks", editable = true }
# isaaclab-rl     = { path = "IsaacLabNewton/source/isaaclab_rl", editable = true }
# isaaclab-newton = { path = "IsaacLabNewton/source/isaaclab_newton", editable = true }
# isaaclab-arena  = { path = "third_party/IsaacLab-Arena", editable = true }
# RoboTwin IsaacLab Arena - manipulation eval tasks (same package works with Newton)
manip-eval-tasks = { path = "third_party/RoboTwinIsaacLabArena/source/manip_eval_tasks", editable = true }
# leisaac (same package works with Newton)

[feature.gigastrap_sim_newton.tasks]
# Smoke test: verify pxr imports cleanly (catches the usd-core/usd-exchange
# overlap regression) and that mujoco-warp + newton resolve. Run this on a
# fresh clone to confirm the env is healthy.
verify = "bash scripts/verify-newton.bash"

# Newton-only activation: lazy pip-install mujoco-warp + newton when missing
# (their metadata is malformed; can't be declarative). The pxr health check
# is NOT here — it lives in the Python training entrypoint where its output
# is visible to the user. See gigastrap_isaaclab_ext/newton/_runtime_check.py.
[feature.gigastrap_sim_newton.target.unix.activation]
scripts = ["scripts/post-install-gigastrap-sim-newton.bash"]

[feature.gigastrap_sim.tasks]

#### GigaStrap FlashSAC Environment (torch 2.9, JAX 0.7) -----------------------------------------
# Standalone env for FlashRL / FlashSAC (https://github.com/Holiday-Robot/FlashSAC).
# Cannot share `feature.gpu` or `feature.isaaclab` with `gsi` because FlashRL hard-pins
# torch==2.9.1 + torchvision==0.24.1 (see DIVERGENCE_NOTES.md), which conflict with
# gsi's torch==2.7.1 pin and pytorch-gpu conda dep. Therefore: own python, own CUDA
# stack, own isaacsim/isaaclab pulled from `https://pypi.nvidia.com` (not editable
# submodule). Used by `scripts/benchmarks/sac_head_to_head.py` for cross-validation;
# `gsi` users cannot run FlashSAC in-process — they must launch the harness under
# `pixi run -e gsf ...` instead.
#
# CURRENT STATUS: wired to the `gsf` environment via the `flash-rl =
# { path = "third_party/flash_rl", editable = true, extras = ["isaaclab"] }`
# pypi-dependency below. FlashRL's missing `[build-system]` block is patched in
# by `scripts/get_submodules_and_patches.bash` using
# `patches/flash_rl_build_system.patch`. Run that script (e.g. via the
# `post-install-gigastrap-sim.bash` chain or directly) before `pixi install -e
# gsf`, otherwise the editable build will fail with "Multiple top-level packages
# discovered" from setuptools' flat-layout auto-discovery.
#
# The pins below are transcribed from FlashRL's upstream pyproject.toml
# `[tool.uv.override-dependencies]` block; if FlashRL bumps versions, mirror here.
[feature.gigastrap_flash_sac]
[feature.gigastrap_flash_sac.system-requirements]
cuda = "12"
libc = "2.35"

[feature.gigastrap_flash_sac.dependencies]
python = "==3.11"
pip = "*"
cuda-version = "==12.8"
cuda-toolkit = "12.8.*"
pytest = ">=7.0.0"     # required by rsl_rl_g/tests/integration/test_sac_head_to_head_smoke.py
hypothesis = ">=6.0,<7"  # rsl_rl_g/tests/conftest.py imports `hypothesis.strategies`
# Stable-Baselines3 base for the SBX head-to-head bench (sbx itself is
# PyPI-only and lives in [feature.gigastrap_flash_sac.pypi-dependencies]).

[feature.gigastrap_flash_sac.pypi-options.dependency-overrides]
torch = "==2.9.1"
torchvision = "==0.24.1"
flatdict = "==4.0.0"
setuptools = "==82.0.1"  # override flash_rl pyproject.toml's `setuptools<=65` runtime pin

[feature.gigastrap_flash_sac.pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.24.1", index = "https://download.pytorch.org/whl/cu128" }
# Intentionally NOT installing the `isaaclab` extra: flash_rl/flash_rl/* has zero
# isaacsim imports, and the `isaaclab` extra pulls isaacsim[all,extscache] which
# transitively brings pywin32 (Windows-only). For gymnasium-env head-to-head this
# is unneeded.
flashrl = { path = "third_party/flash_rl", editable = true }
# rsl_rl_g is the "ours" side of `scripts/benchmarks/sac_head_to_head.py`; both
# halves run in one process so we install it editable here as well.
rsl-rl-g = { path = "rsl_rl_g", editable = true }
# JAX stack from FlashRL pyproject (pin explicitly to avoid surprise resolution).
jax = { version = "==0.7.1", extras = ["cuda12"] }
jaxlib = "==0.7.1"
flax = "==0.10.1"
wandb = "==0.23"
Cython = "==0.29.37"
# brax + MJX = GPU-vectorised MuJoCo for 10k-env head-to-head benches
# (scripts/benchmarks/{sac_vec,ppo,hybrid_sac_ppo}_head_to_head.py).
# Brax 0.14.x requires jax>=0.4.6 (compatible with our pin 0.7.1) and pulls
# mujoco-mjx in lockstep with the mujoco runtime (currently 3.8.1 in gsf).
brax = ">=0.14.2"
mujoco-mjx = ">=3.3.3,<3.9"
jaxopt = "*"

# SBX (Stable-Baselines-Jax). Conda-forge doesn't publish it, so PyPI-only.
# stable-baselines3 (the SB3 base) IS on conda-forge -- see the
# [feature.gigastrap_flash_sac.dependencies] block above for that pin.
# Together they let the head-to-head benches run OURS + FlashSAC + SBX
# all against the same brax/MJX env in a single pixi env, so the
# comparison is truly apples-to-apples on physics.
sbx-rl = ">=0.26.0"

