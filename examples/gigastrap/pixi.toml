[workspace]
# pytorch channel needed for torch/torchaudio/torchvision/torchcodec py3.11
# builds that conda-forge doesn't ship (its torch builds are CPU-only or
# limited to older pythons). retread's probe identified torchaudio
# >=2.7,<3 as definitively unsatisfiable on conda-forge for py3.11 and
# fell back to PyPI bundle, but the cleaner path is letting conda
# resolve from the pytorch channel directly. List BEFORE conda-forge so
# torch-family deps prefer pytorch's GPU-enabled builds.
channels = ["https://prefix.dev/conda-forge"]
name = "gigastrap"
platforms = ["linux-64"]
version = "0.1.0"
# Added for retread test: enables `[package.build]` source packages.
# To revert: drop this line.
preview = ["pixi-build"]
# Single source of truth for the python minor used across the workspace
# AND every pixi-build source-package backend (e.g. retread). pixi-build
# forwards this to source packages' `conda/outputs` calls AND uses it
# when selecting variants of the backend itself, so retread's
# variant-built artifact (py311 vs py312) is auto-picked to match.
# Upgrade by editing just this one line; rebuild retread only if you
# add a python the variant list doesn't cover (see retread's
# recipe/variants.yaml). Inline form (one line) keeps the [workspace]
# table contiguous -- a [workspace.build-variants] sub-table header
# would steal every subsequent key-value pair like `conda-pypi-map`.
build-variants = { python = ["3.11"] }
# Map conda pywin32 to satisfy pypi pypin32 requirement (isaacsim needs pywin32 but it's Windows-only on PyPI)
conda-pypi-map = { "https://prefix.dev/conda-forge" = "patches/conda_pypi_map.json" }

# Global PyPI options - extra indexes for NVIDIA and MuJoCo packages
[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com", "https://py.mujoco.org"]
# Default uv index-strategy is "first-index" — it stops at the first index
# that publishes a package. Because py.mujoco.org publishes mujoco (only dev
# wheels >=3.7), uv refuses to fall through to PyPI for stable 3.5.x. We
# trust both indexes (NVIDIA, mujoco.org, PyPI) so allow uv to pick the
# best version across all of them.
index-strategy = "unsafe-best-match"
# flatdict 4.0.1 ships only as sdist; its setup.py imports pkg_resources,
# which modern setuptools (>=82) drops.  Disabling build isolation lets uv
# use the conda-installed setuptools (which still bundles pkg_resources).
no-build-isolation = ["flatdict"]

# Override malformed dependencies from mujoco-warp and newton git packages.
# mujoco upper bound: 3.6+ wheels vendor a `mujoco_warp` snapshot whose API
# (wp.array2d[int], wp.Texture2D, ...) doesn't match the warp 1.8.2 that Isaac
# Sim ships in omni.warp.core. Stay on the 3.5.x line until Isaac Sim bumps
# its bundled warp.
# Floor at 3.3.3 (light_type API). py.mujoco.org has pruned old dev wheels;
# the actual stable 3.5.0 wheel is on regular PyPI — see the per-feature
# index pin below.


#### All possible environment combinations
[environments]
cpu = { features = ["cpu"] } # All you need for bare-bones
gpu = { features = ["gpu", ] }
ros2-gpu = { features = [ "gpu", "ros2", ]}
ros2-cpu = { features = ["cpu", "ros2"]}
# genesis-gpu = { features = ["gpu", "genesis"]}
# genesis-ros2-gpu = { features = ["gpu", "genesis", "ros2", ]} # Advanced users ;)

# Isaac Lab is not yet compatible with the other environments, due to Python and Torch version conflicts
# use on it's own for now. See below for more info.
isaaclab-gpu = {features = ["isaaclab", "gpu" ]}
# isaaclab-ros2-gpu ={ features = ["isaaclab", "ros2", "gpu"]} # Some torch issues with this
# Now, for the other environment configurations.
### ONLY CUSTOM IN FILE
gsi = { features = ["isaaclab", "gpu", "gigastrap_sim", "gigastrap_sim_physx"] } # GigaStrap Isaac Sim (PhysX)
gsn = { features = ["isaaclab", "gpu", "gigastrap_sim", "gigastrap_sim_newton"] } # GigaStrap Isaac Sim (Newton)
gsi-ros2 = { features = ["isaaclab", "ros2", "gpu", "gigastrap_sim", "gigastrap_sim_physx"] } # GigaStrap Isaac Sim (PhysX) with ROS 2
gsrli = { features = ["robotwin_rlinf"], no-default-feature = true } # RoboTwin RLinf (SAPIEN 3 -- fully standalone, no global deps)
# GigaStrap FlashSAC env (torch 2.9, JAX 0.7). Standalone -- shares no features
# with `gsi`/`gsn` because FlashRL hard-pins torch==2.9.1 / torchvision==0.24.1,
# which conflict with `feature.gpu`'s `pytorch-gpu>=2.7.1,<3` and
# `feature.isaaclab`'s `torch==2.7.1` dep override. This env mirrors `gsrli`'s
# standalone pattern: it owns its own python, CUDA toolkit, torch wheel, and
# pulls `isaacsim`/`isaaclab` directly from `https://pypi.nvidia.com` (NOT the
# editable IsaacLab submodule -- FlashRL expects the published wheel layout via
# its `isaaclab` extra).
#
# FlashRL is vendored as a submodule at `third_party/flash_rl` (URL:
# https://github.com/Holiday-Robot/FlashSAC, pinned to upstream `main` HEAD
# `87edc9061150ae9e962dd84e6544e27a1554b3ab`). Its upstream `pyproject.toml`
# has no `[build-system]` and no `[tool.setuptools.packages]` declaration, so
# setuptools flat-layout auto-discovery refuses to build it (sees `results/`,
# `configs/`, `flash_rl/` as sibling top-level candidates). The patch at
# `patches/flash_rl_build_system.patch` prepends the missing two blocks; it is
# applied idempotently by `scripts/get_submodules_and_patches.bash` after
# `git submodule update --init`. Run that script (or `pixi run -e # gsf
# post-install`) before `pixi install -e gsf`.
gsf = { features = ["gigastrap_flash_sac"], no-default-feature = true } # GigaStrap FlashSAC (torch 2.9, JAX 0.7); local submodule at third_party/flash_rl, build-system patched in scripts/get_submodules_and_patches.bash
record = { features = ["pusht_record"], no-default-feature = true } # PushT teleop demo recorder (third_party/gym_pusht/scripts/record_demos.py)
# Feel free to ignore and delete features you don't need!

