"protomotions-deps-pack" = { path = "./pypi-packs/protomotions-deps-pack" } # retread-deps-from proof: ProtoMotions' requirements_isaaclab.txt pulled live from git instead of hand-listed below
python = "==3.11"
pip = ">=25.1.1,<26"
setuptools = ">=68,<81"
wheel = ">=0.43,<1"
toml = ">=0.10.2,<0.11"
cuda-version = "==12.8"
cuda-nvcc_linux-64 = "12.8.*"
cuda-toolkit = "12.8.*"
sysroot_linux-64 = ">=2.35"
gxx_linux-64 = ">=12"
gcc_linux-64 = ">=12"
binutils_linux-64 = ">=2.40"
cmake = ">3.6"
# ProtoMotions accepts NumPy >=1.21.1, while IsaacLab's Numba 0.59 line
# requires NumPy <2. Keep the environment on the previously proven release.
numpy = "==1.26.4"
# Harmonize ProtoMotions' broad framework roots with IsaacLab's authoritative
# wheel constraints so the two source packs share one conda provider set.
transformers = "==4.57.6"
trimesh = ">=4.5.1,<4.6"
moviepy = "==2.2.1"
# Isaac Sim's Kit runtime (libcarb.so) needs GLIBCXX_3.4.30, which the host's spack
# gcc-runtime libstdc++ (picked up via LD_LIBRARY_PATH) lacks -- "Unable to bootstrap
# inner kit kernel". Pull a newer libstdc++ from conda-forge and put $CONDA_PREFIX/lib
# first on LD_LIBRARY_PATH so it's found before the spack one.
libstdcxx-ng = ">=13"
[feature.pm-isaaclab.pypi-dependencies]
torch = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }
# imprint itself: pm-* envs set no-default-feature = true, which skips the
# [target.unix.activation] post-install.bash that installs this for other envs --
# without it, `doit` tasks fail with ModuleNotFoundError: No module named 'imprint'
# (tasks/_launchers.py imports imprint.resource_limits).
imprint = { path = ".", editable = true }
# ProtoMotions itself (third_party/ProtoMotions submodule), plus its
# requirements_isaaclab.txt closure not already covered by the retread wheels above.
protomotions = { path = "third_party/ProtoMotions", editable = true }
# The 12 framework deps formerly hand-listed here (tensordict, lightning,
# scikit-image, rtree, trimesh, typer, transformers, easydict, hydra-core,
# moviepy, dm_control, pandas) now come from protomotions-deps-pack's
# `retread-deps-from` root (upstream requirements_isaaclab.txt at the
# submodule's pinned rev) instead of being hand-copied here.
[feature.pm-isaaclab.activation.env]
CUDA_HOME = "$CONDA_PREFIX"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
OMNI_KIT_ACCEPT_EULA = "YES"
[feature.pm-isaaclab.target.unix.activation]
