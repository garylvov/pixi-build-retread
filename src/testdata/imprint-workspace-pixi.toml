[feature.isaaclab-viral.target.unix.activation]
scripts = ["scripts/post-install.bash"]
# post-install installs the upstream gr00t package editable with --no-deps so
# Pixi remains the single locked owner of torch, OpenCV, Isaac, and HF deps.
[feature.viral.dependencies]
# App-owned: the pack audit has no direct OmegaConf edge.
omegaconf = ">=2.3,<3"
loguru = ">=0.7,<1"
onnxruntime = ">=1.20,<2"
pandas = ">=2.2,<3"
termcolor = ">=2.4,<4"
rich = ">=13.7,<16"
plotly = ">=5.22,<7"
datasets = ">=3,<5"
git-lfs = ">=3,<4"
# Datasets requires the fsspec HTTP extra; the pack does not own this cap.
fsspec = ">=2023.1.0,<=2026.4.0"
aiohttp = ">=3.8,<4"
[feature.viral.pypi-dependencies]
# RESTORED 2026-08-19 (cert Phase 2): viral-gpu lost tensordict — load-bearing INTENT; PyPI on purpose (conda build pulls a second PyTorch).
tensordict = "==0.8.3"
[feature.viral.target.unix.activation]
scripts = ["scripts/post-install.bash"]

