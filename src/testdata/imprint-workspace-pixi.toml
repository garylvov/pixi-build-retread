#### VIRAL / GR00T VisualSim2Real Environment-----------------------------------------------------
# GR00T-VisualSim2Real's VIRAL branch documents Isaac Sim 5.1 on Python 3.11.
# Keep it isolated from SONIC and the root Isaac Sim 6 pack because upstream
# can change independently even though today's declared simulator stack matches
# the Isaac Sim 5.1 / PyTorch 2.7 line.
[feature.isaaclab-viral]
[feature.isaaclab-viral.dependencies]
isaaclab-viral-pack = { path = "./pypi-packs/isaaclab-viral-pack" }
python = "==3.11"
pip = ">=25.1.1,<26"
setuptools = ">=68,<81"
wheel = ">=0.43,<1"
cuda-version = "==12.8"
sysroot_linux-64 = ">=2.35"

[feature.isaaclab-viral.pypi-dependencies]
