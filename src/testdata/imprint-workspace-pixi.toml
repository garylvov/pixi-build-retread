### RoboJuDo Deploy Stack ---------------------------------------------------------------
# Sim2real-style verification harness (imprint.protomotions.robojudo_rollout, run
# via tasks/protomotions.py's `doit robojudo:verify`). Supersedes the "robojudo" conda env
# from docs/verbose/protomotions-h1_2-full-workflow.md Section 2.5 -- this machine has
# no conda/miniforge, and the rest of the repo standardizes on pixi, so a pixi feature
# (mirroring pm-mujoco above) is the consistent choice here instead of installing conda
# just for this one env.
#
# Composed INTO newton-gpu rather than standing alone: RoboJuDo replays a tracker
# policy against a physics backend, and Newton is the backend imprint targets. The
# two halves it does not own are deliberately absent from the pack and inherited
# from the composed env -- torch from [feature.gpu] (conda pytorch-gpu) and mujoco
# from [feature.newton] (mujoco-python 3.8.x). Upstream declares both unpinned, so
# the env's pins satisfy them.
#
# The dependency list is NOT restated here: robojudo-pack carries
# retread-deps-from pointing at upstream's requirements.txt at the same git rev
# the third_party/RoboJuDo submodule pins, so upstream stays the single source of
# truth and the two can never drift (same pattern as protomotions-deps-pack).
[feature.robojudo.dependencies]
robojudo-pack = { path = "./pypi-packs/robojudo-pack" }

### figaroh-plus Environment (Track 2 sys-ID: Pinocchio parametric ID) -------
# Identifies rigid-body inertias + joint friction from measured torque tau via a
# Newton-Euler linear regressor (figaroh.identification, built on Pinocchio).
# ISOLATED feature, exposed only through the no-default `figaroh` environment so
# the heavy conda Pinocchio stack (eigenpy/hpp-fcl/coal/boost/casadi) never
# perturbs the robojudo/gpu shells. Adapter: imprint.figaroh (npz ->
# q/dq/ddq/tau CSVs in URDF Pinocchio joint order + an identification YAML).
# from_mjcf is unimplemented upstream, so H1_2 is fed as URDF
# (third_party/unitree_rl_gym/resources/robots/h1_2/h1_2.urdf).
[feature.pace]
[feature.pace.activation.env]
CUDA_HOME = "$CONDA_PREFIX"

[feature.pace.dependencies]
# Repointed off the Isaac Sim 6 isaac-pack onto the consolidated Isaac Sim 5.1 /
# IsaacLab v2.3.2 shared pack. pace's README targets Isaac Sim 5.0/latest so 5.1
# is compatible. The shared pack carries only the isaac bundle (no torch), so the
# torch/cuda rows that isaac-pack's Sim-6 closure used to supply are pinned here
# to the 5.1 line (mirrors feature.isaaclab-viral). Env stays [lock-skip:minimal]
# (inactive) until its own cold lock + smoke is run in a follow-up.
"isaaclab-2.3x-pack" = { path = "./pypi-packs/isaaclab-2.3x-pack" }
python = "==3.11"
pip = ">=25.1,<26"
setuptools = ">=68,<81"
wheel = ">=0.43,<1"
cuda-version = "==12.8"
sysroot_linux-64 = ">=2.35"
# Version owner: without this provider the bundled closure drifts Pillow.
numpy = ">=1.26,<1.27"
pillow = "==10.4.0"

[feature.pace.pypi-dependencies]
torch = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0", index = "https://download.pytorch.org/whl/cu128" }
imprint = { path = ".", editable = true }
cmaes = "*"
pace_sim2real = { path = "third_party/pace-sim2real/source/pace_sim2real", editable = true }

[feature.pace.target.unix.activation]
scripts = ["scripts/post-install.bash"]
