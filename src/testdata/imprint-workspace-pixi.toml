  { channel = "https://prefix.dev/pytorch", priority = 200 },
  { channel = "https://prefix.dev/nvidia", priority = 100 },
  "https://prefix.dev/conda-forge",
]
[feature.unitree-rl-gym.dependencies]
unitree-rl-gym-pack = { path = "./pypi-packs/unitree-rl-gym-pack" }
python = "==3.8"
pip = ">=24,<25"
doit = ">=0.36.0,<0.38"
setuptools = ">=65,<69"
wheel = ">=0.43,<1"
numpy = ">=1.20.3,<1.21"
matplotlib = ">=3.6,<3.8"
pyyaml = ">=6,<7"
scipy = ">=1.7,<1.11"
tomli = ">=2,<3"
xkeyboard-config = ">=2.47,<3"
[feature.unitree-rl-gym.target.unix.activation]
scripts = ["scripts/post-install.bash"]

#### Holosoma Environment (Amazon FAR) ------------------------------------------------------------
# Isolated no-default environment for pulling holosoma's reward + randomization
# terms into the H1_2 env. The retread pack owns Holosoma's sibling source
# wheels and normalizes their upstream dependency metadata; the root feature owns
# the runtime NumPy/PyTorch/CUDA contract.
[feature.holosoma]
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/pytorch",
  "https://prefix.dev/nvidia",
]
[feature.holosoma.activation.env]
CUDA_HOME = "$CONDA_PREFIX"
MUJOCO_GL = "egl"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
[feature.holosoma.dependencies]
holosoma-pack = { path = "./pypi-packs/holosoma-pack" }
python = "==3.11"
pip = ">=25.1.1,<26"
numpy = "==1.26.4"
# Keep Holosoma's Torch family on conda. This mirrors the current root GPU
# stack without inheriting the unrelated pytorch3d/mujoco-mjx dependencies.
cuda-version = "==12.9"
cuda-nvcc_linux-64 = "12.9.*"
cuda-toolkit = "12.9.*"
pytorch-gpu = "==2.10.0"
[feature.holosoma.target.unix.activation]
scripts = ["scripts/post-install.bash"]

#### RoboGen Environment------------------------------------------------------------------------
# RoboGen uses a legacy CUDA 11.7-era PyTorch, Ray 1.x/RLlib, old Gym,
# PyBullet, and OMPL stack. Keep it as a no-default root environment so the
# stack is available from the canonical manifest without constraining default
# project environments.
[feature.robogen]
[feature.robogen.dependencies]
robogen-pack = { path = "./pypi-packs/robogen-pack" }
python = ">=3.10,<3.11"
pip = ">=23,<24"
setuptools = ">=65,<66"
wheel = ">=0.38,<1"
click = ">=7,<=8.0.4"
numpy = ">=1.26,<2"
scipy = ">=1.10,<1.11"
pandas = ">=1.5,<1.6"
pyyaml = ">=6,<7"
pillow = ">=9.4,<10"
matplotlib-base = ">=3.7,<3.8"
scikit-learn = ">=1.3,<1.4"
imageio = ">=2.26,<3"
ffmpeg = ">=4,<5"
gym = "==0.21.0"
[feature.robogen.target.unix.activation]
scripts = ["scripts/post-install.bash"]

#### Unitree RL Lab Environment-----------------------------------------------------------------
# Unitree RL Lab's README targets Isaac Sim 5.1.0 + Isaac Lab 2.3.0 on Python 3.11.
# Keep it separate from the root Isaac Sim 6 / Python 3.12 packs.
[feature.isaaclab-unitree.dependencies]
"isaaclab-2.3x-pack" = { path = "./pypi-packs/isaaclab-2.3x-pack" } # consolidated shared Isaac Sim 5.1 / IsaacLab v2.3.2 stack
python = "==3.11"
pip = ">=25.1.1,<26"
setuptools = ">=68,<81"
wheel = ">=0.43,<1"
cuda-version = "==12.8"
cuda-nvcc_linux-64 = "12.8.*"
cuda-toolkit = "12.8.*"
# Keep compiled sim2sim binaries below the Ubuntu 22.04 host ABI. The next
# conda-forge sysroot after 2.34 is 2.39 and emits binaries this host cannot run.
sysroot_linux-64 = ">=2.34,<2.35"
gxx_linux-64 = ">=12"
gcc_linux-64 = ">=12"
binutils_linux-64 = ">=2.40"
cmake = ">3.6"
# Version owner: without this provider the bundled closure drifts Pillow.
numpy = "<2"
pillow = "==10.4.0"
# Isaac Sim 5.1's Kit prebundle can appear ahead of the environment on
# sys.path during full GUI startup. Keep FastAPI/Pydantic on versions that do
# not require newer typing_extensions APIs than Kit 107's bundled copy exposes.
fastapi = "==0.115.7" # retread:pin
pydantic = ">=2.11,<2.12"
typing-extensions = ">=4.12.2,<4.13"

[feature.isaaclab-unitree.pypi-dependencies]
torch = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }

[feature.isaaclab-unitree.activation.env]
CUDA_HOME = "$CONDA_PREFIX"
[feature.isaaclab-unitree.target.unix.activation]
scripts = ["scripts/post-install.bash"]
[feature.unitree-rl-lab.dependencies]
argcomplete = ">=3.0,<4"
doit = ">=0.37.0,<0.38"
boost-cpp = ">=1.84,<1.90"
yaml-cpp = ">=0.8,<0.9"
fmt = ">=11,<12"
spdlog = ">=1.15,<2"
glfw = ">=3.4,<4"
libgl-devel = ">=1.7,<2"
libegl-devel = ">=1.7,<2"
[feature.unitree-rl-lab.pypi-dependencies]
# Isaac Sim 5.1's retread closure emits pycares>=4.8,<4.9 for Python 3.11.
# aiodns 4 requires pycares>=5 and imports symbols absent from pycares 4.8, so
# keep aiodns on the compatible 3.x PyPI line.
aiodns = ">=3.1,<4"
[feature.unitree-rl-lab.target.unix.activation]
scripts = ["scripts/post-install.bash"]

