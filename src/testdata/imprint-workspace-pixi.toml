### ProtoMotions Newton Environment---------------------------------------------------------------
# ProtoMotions targets Newton 1.0.0, pinned separately from newton-pack-latest (which tracks a
# newer Newton release needing mujoco>=3.8) in pypi-packs/pm-newton-pack/. pm-newton-pack resolves
# the official Newton 1.0.0 wheel with its `examples` extra; the workspace pins below own the
# compatible mujoco==3.5.0 and mujoco-warp==3.5.0.2 wheels. This does NOT compose with
# [feature.newton] (that feature's conda mujoco-warp/mujoco-python pins target the newer Newton
# release and directly conflict with this pin). Composes with [feature.gpu] (torch/cuda) via the
# pm-newton-gpu env.
[feature.pm-newton.dependencies]
pm-newton-pack = { path = "./pypi-packs/pm-newton-pack" }
# openmesh==1.2.1 (pypi-dependencies below) ships no cp312 wheel; its sdist
# needs a C++ toolchain at install time, same as the isaaclab features.
gxx_linux-64 = ">=12"
cmake = "<4" # openmesh 1.2.1 CMakeLists needs cmake_minimum_required <3.5, removed in cmake 4
# Deliberately no python pin: retread-python="3.12" in pm-newton-pack, and ProtoMotions only
# requires 3.10+ (3.11+ preferred) for Newton, which 3.12 satisfies.
# Artifact verdict: NOT fully migratable. openmesh==1.2.1 is the sole blocker;
# keep the entire wall feature-owned until Retread can build hermetic native sdists.
[feature.pm-newton.pypi-dependencies]
# See the pm-isaaclab section above: no-default-feature = true skips the
# post-install.bash step that installs this for other envs, and `doit` needs it.
imprint = { path = ".", editable = true }
protomotions = { path = "third_party/ProtoMotions", editable = true }
# pm-newton-pack's retread-relax policy ("patch-then-minor-then-major-then-last-resort")
# silently bumped mujoco/mujoco-warp from the pack's intended 3.5.0/3.5.0.2 (matching
# Newton 1.0.0's requirements_newton.txt) all the way to 3.10.0/3.10.0.1 -- something
# else in this env's solve (numpy 2.x?) was incompatible with the old pins, so retread
# relaxed upward to find ANY installable combination. That newer mujoco breaks at
# RUNTIME (not solve time): Newton's SolverMuJoCo._convert_to_mjc -> body.add_joint(...)
# raises "TypeError: stiffness should be a numeric scalar or list." for every robot
# (reproduced with both the H1_2 checkpoint and ProtoMotions' own bundled G1 checkpoint --
# not H1_2-specific). Pin explicitly back down to force the version Newton 1.0.0 expects.
mujoco = "==3.5.0" # retread:pin
mujoco-warp = "==3.5.0.2" # retread:pin
tensordict = "==0.9.0"
lightning = "*"
scikit-image = "*"
rtree = ">=1.2,<2"      # was ==1.2.0; ranged 08-20 so co-resident isaaclab (isaacsim pins 1.3.0) converges
trimesh = "*"
typer = ">=0.6.1"
transformers = ">=4.20.1"
easydict = "*"
wandb = ">=0.23,<1"     # was ==0.23.0; ranged 08-20 for co-resident convergence (isaaclab resolves 0.28.2)
sentry-sdk = "==2.0.0"
hydra-core = ">=1.3.2,<1.4"
moviepy = "*"
dm_control = "==1.0.37"
pandas = "*"
openmesh = "==1.2.1"
tensorboardX = "*"
# Same gap as pm-mujoco (see its pypi-dependencies comment): rest of
# requirements_newton.txt not covered by the retread wheels above. Hit at
# inference_agent.py runtime (torch.load's pickle class resolution walks most of
# the ProtoMotions module tree), not by a bare `import protomotions`.
matplotlib = "*"
termcolor = ">=1.1.0"
rich = "*"
wheel = "*"
# setuptools deliberately unpinned (unlike pm-mujoco/requirements_newton.txt's
# ==69.5.1): pm-newton-gpu's conda solve (via the gpu feature) already resolves
# setuptools==82.0.1, and requirements_newton.txt's exact pin conflicts with it.
numpy = ">=1.21.1"

