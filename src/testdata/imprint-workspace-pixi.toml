[workspace]
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/pixi-build-backends",
]
name = "imprint"
platforms = [
  { name = "linux-64-base", platform = "linux-64", glibc = "2.34" },
  { name = "linux-64-cuda-12", platform = "linux-64", cuda = "12", glibc = "2.34" },
  { name = "linux-64-cuda-11", platform = "linux-64", cuda = "11", glibc = "2.34" },
  { name = "linux-64-cuda-12-glibc-2-35", platform = "linux-64", cuda = "12", glibc = "2.35" },
  { name = "linux-aarch64-jetson", platform = "linux-aarch64", linux = "5.15", glibc = "2.35", cuda = "12.6" },
]
version = "0.1.0"
preview = ["pixi-build"]
build-variants = { python = ["3"] }
# Map conda package names to the PyPI names required by retreaded simulator
# wheels and mixed conda/PyPI environments.
# NOTE: every channel keyed here MUST be declared in [workspace].channels or in
# some active feature's `channels` list; `pixi add` hard-fails otherwise (this
# broke when the pytorch-channel features were commented out during slimming).
# TODO(pixi>=0.71): migrate to structured conda-pypi-map
conda-pypi-map = { "https://prefix.dev/conda-forge" = "patches/conda_pypi_map.json", "https://conda.anaconda.org/pytorch" = "patches/conda_pypi_map.json", "https://prefix.dev/pytorch" = "patches/conda_pypi_map.json" }

[workspace.target.linux-aarch64.build-variants]
c_stdlib = ["sysroot"]
c_stdlib_version = ["2.17"]

# Global PyPI options - extra indexes for NVIDIA and MuJoCo packages
[pypi-options]
extra-index-urls = ["https://pypi.org/simple", "https://pypi.nvidia.com", "https://py.mujoco.org"]
index-strategy = "unsafe-best-match"

# Override malformed dependencies from mujoco-warp and newton git packages
# [pypi-options.dependency-overrides]
# warp-lang = ">=1.11.0.dev0"
# mujoco = ">=3.3.7"

#### Base Bare Bones Environment

[dependencies] # Global dependencies across all environments
python = "==3.12"
pip = ">=25.1.1,<26"
hatchling = ">=1.27.0,<2"
numpy = ">=1.26.4,<3"
matplotlib = ">=3.10.3,<4"
jupyter = ">=1.1.1,<2"
ipywidgets = ">=8.1.5,<9"
toml = ">=0.10.2,<0.11"
doit = ">=0.37.0,<0.38"


[tasks]
doit = "python -m tasks.doit_run"

[feature.doit-task-runner.tasks]
doit = "python -m tasks.doit_run"

[feature.doit-task-runner.dependencies]
doit = ">=0.36.0,<0.38"

[target.unix.activation]
scripts = ["scripts/post-install.bash"] # pip  install the package in editable mode

#### All possible environment combinations
[feature.platform-base]
platforms = ["linux-64-base"]

[feature.platform-cuda]
platforms = ["linux-64-cuda-12"]

[feature.platform-robogen]
platforms = ["linux-64-cuda-11"]

[feature.platform-isaac]
platforms = ["linux-64-cuda-12-glibc-2-35"]

[feature.platform-jetson]
platforms = ["linux-aarch64-jetson"]

[environments]
default = { features = ["platform-base"] }
cpu = { features = ["platform-base", "cpu", "tensorboard-tools"] } # All you need for bare-bones
test = { features = ["platform-base", "test", "cpu"] } # This environment is relied upon by default by the CI
tensorboard-tools = { features = ["platform-base", "doit-task-runner", "tensorboard-tools"], no-default-feature = true } # Terminal TensorBoard log inspection and plotting

## The following environment combinations are optional and can safely be removed if not needed.
gpu = { features = ["platform-cuda", "gpu", ] }
test-gpu = { features = ["platform-cuda", "gpu", "test", ] }
unitree-rl-gym = { features = ["platform-cuda", "doit-task-runner", "unitree-rl-gym"], no-default-feature = true }
holosoma = { features = ["platform-cuda", "doit-task-runner", "holosoma"], no-default-feature = true }
unitree-rl-lab-gpu = { features = ["platform-isaac", "doit-task-runner", "isaaclab-unitree", "unitree-rl-lab"], no-default-feature = true } # consolidated onto isaaclab-2.3x-pack
groot-sonic-gpu = { features = ["platform-isaac", "doit-task-runner", "isaaclab-sonic", "groot-sonic"], no-default-feature = true }
viral-gpu = { features = ["platform-isaac", "doit-task-runner", "isaaclab-viral", "viral"], no-default-feature = true }
uwlab-gpu = { features = ["platform-isaac", "doit-task-runner", "isaaclab-uwlab", "uwlab"], no-default-feature = true } # consolidated onto isaaclab-2.3x-pack
flashsac-gpu = { features = ["platform-isaac", "doit-task-runner", "flashsac"], no-default-feature = true }
# Backend 4.8.8 preserves Hover's explicit PyPI Torch 2.5.1 ownership; the
# generated pack metadata no longer exposes the old conda Torch edge.
hover-gpu = { features = ["platform-isaac", "doit-task-runner", "isaaclab-hover", "hover"], no-default-feature = true }
# re-enabled 2026-07-12: locks GREEN under published backend 4.5.3 via the curated
# [feature.sage] closure + sage-isaac-pack (isaacsim 4.2.0.2, extscache — builds
# clean, retread_version=4.5.3 confirmed). PLAN Phase-3.1 deps-from refinement
# (grok server/pyproject.toml like protomotions-deps-pack) was evaluated and
# DEFERRED: third_party/sage server/pyproject.toml is a hostile deps-from source
# — 10 deps would need dropping (4 isaacsim self-refs the pack already owns; 2
# git-source builds nvdiffrast/pytorch3d; 4 local editables omni-isaac-lab×3 /
# m2t2 / pointnet2_ops / nvidia-curobo all pinned to nonexistent /home/hongchix
# paths via [tool.uv.sources]) AND it carries a HARD pin conflict against the
# env's own conda block (server pillow==9.3.0 vs [feature.sage] pillow>=10,<13)
# plus divergent unvalidated pins (diffusers 0.35.1 vs curated 0.11.1). Swapping
# the validated closure for it would regress a green env for a pin-cleanup
# nicety — kept the curated closure; revisit if upstream cleans server pyproject.
sage = { features = ["platform-isaac", "doit-task-runner", "sage"], no-default-feature = true } # includes the required sage-isaac-pack
# re-enabled 2026-07-12: locks GREEN under published backend 4.5.3 (legacy torch
# 2.0.0+cu117 / gym 0.21.0 / ray 1.13.0 / ompl 2.0.0 closure resolves clean).
robogen = { features = ["platform-robogen", "doit-task-runner", "robogen"], no-default-feature = true }
ros2-humble-gpu = { features = ["platform-cuda", "gpu", "ros2-humble"] }
ros2-humble-cpu = { features = ["platform-base", "cpu", "ros2-humble"] }

# Isaac Sim 6.0.0.1 + IsaacLab 3.0 beta2, with CUDA/PyTorch owned by gpu.
isaaclab-gpu-latest = { features = ["platform-isaac", "doit-task-runner", "isaaclab-latest", "gpu"], no-default-feature = true }
newton-gpu = { features = ["platform-cuda", "newton", "robojudo", "gpu"] }

# ProtoMotions (https://nvlabs.github.io/ProtoMotions/) environments.
pm-isaaclab = { features = ["platform-isaac", "doit-task-runner", "pm-isaaclab"], no-default-feature = true }
pm-newton-gpu = { features = ["platform-cuda", "doit-task-runner", "pm-newton", "gpu"], no-default-feature = true }
pm-mujoco = { features = ["platform-base", "doit-task-runner", "cpu", "pm-mujoco"], no-default-feature = true }
# RoboJuDo sim2real-style verification harness (see
# src/imprint/protomotions/robojudo_verify.py, `doit robojudo:verify`).
# CPU-only (onnxruntime CPUExecutionProvider is hardcoded by RoboJuDo's tracker
# policy) -- kept as its own env/feature (not folded into pm-mujoco) because it's
# a different Python package (third_party/RoboJuDo submodule) with its own,
# much lighter dependency set. This replaces the conda env described in
# docs/verbose/protomotions-h1_2-full-workflow.md Section 2.5 -- this machine
# has no conda/miniforge install and the project otherwise standardizes on
# pixi for every other env, so a conda env would be a one-off inconsistent
# with the rest of the repo.
# Track 2 sys-ID envs. Isolated no-default environments keep the heavy stacks out
# of unrelated shells: figaroh drags in the conda Pinocchio stack; pace drags in
# the multi-GB Isaac isaac-pack. Install explicitly with `pixi install -e figaroh`
# / `pixi install -e pace`. SAGE (the third Track-2 tool) needs no env here --
# its light analysis half is folded into the `robojudo` env above.
pace = { features = ["platform-isaac", "doit-task-runner", "pace"], no-default-feature = true }

# ROS 2 Jazzy variants (mirror the Humble envs; see [feature.ros2-jazzy]).
ros2-jazzy-gpu = { features = ["platform-cuda", "gpu", "ros2-jazzy"] }
ros2-jazzy-cpu = { features = ["platform-base", "cpu", "ros2-jazzy"] }
jetson = { features = ["platform-jetson", "doit-task-runner", "jetson"], no-default-feature = true }
# Now, for the other environment configurations.
# Feel free to ignore and delete features you don't need!

[feature.cpu.dependencies]
rich = ">=13.7,<16"
huggingface_hub = ">=1.16,<2"

#### Jetson JetPack 6.1 Environment---------------------------------------------------------------
# Native-only deployment environment for Jetson Orin running JetPack 6.1.
# CUDA is owned by JetPack on the host: do not add conda CUDA toolkit packages
# or compose this feature with the x86_64 Isaac/GPU features.
[feature.jetson]

[feature.jetson.dependencies]
python = "==3.10.20"
pip = "*"
cyclonedds = "==0.10.5"
cyclonedds-python-binding = { path = "./packages/cyclonedds-python-binding" }

[feature.jetson.activation.env]
CYCLONEDDS_HOME = "$CONDA_PREFIX"

# Artifact verdict: NOT fully migratable. Retread rejects the NVIDIA wheel because
# its decoded filename version does not match its internal METADATA version.
# Migration is forbidden regardless: this aarch64 wall is audit-only.
[feature.jetson.pypi-dependencies]
torch = { url = "https://developer.download.nvidia.com/compute/redist/jp/v61/pytorch/torch-2.5.0a0%2B872d972e41.nv24.08.17622132-cp310-cp310-linux_aarch64.whl#sha256=6f75fd2d2ef840ede1a90dbcf40a5458214bee26cc803fa510cda2e8978d972a" }
numpy = "==1.26.1"
networkx = "==3.4.2"
etils = "==1.13.0"
opencv-python = "==4.10.0.84"
mujoco = "==3.2.3"
onnxruntime = "==1.23.2"
imprint = { path = ".", editable = true }
unitree_sdk2py = { path = "third_party/unitree_sdk2_python", editable = true }

#### Test Environment----------------------------------------------------------------------------
# This environment is relied upon by default by the CI in .github/workflows/pre-commit.yml
[feature.test.dependencies]
pytest = ">=7.0.0"
pre-commit = ">=3.6.0"

#### TensorBoard Log Tools-----------------------------------------------------------------------
[feature.tensorboard-tools.dependencies]
python = "==3.12"
pip = ">=25.1.1,<26"
tensorboard = ">=2.20,<3"

[feature.tensorboard-tools.pypi-dependencies]
uniplot = ">=0.23.1,<0.24"

#### GPU Environment-----------------------------------------------------------------------------
[feature.gpu]
# Channels would go here.

# Set CUDA_HOME for torch.compile/Triton to find ptxas
[feature.gpu.activation.env]
CUDA_HOME = "$CONDA_PREFIX"
# Prioritize the env's own libs on the loader path. Two reasons on shared HPC
# (OSCAR/CCV): (1) some site module systems leak libstdc++ into LD_LIBRARY_PATH,
# shadowing conda's newer one (GLIBCXX_3.4.30 ImportError); (2) conda pytorch's
# libtorch_cuda.so needs conda nccl (in $CONDA_PREFIX/lib) rather than a stale
# bundled CUDA lib. Prepending $CONDA_PREFIX/lib makes the env authoritative.
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

# Thank you to Matthew Feickert for the system requirements tip!
# https://pixi.sh/latest/workspace/system_requirements/
# https://matthewfeickert-talks.github.io/reproducible-ml-for-scientists-with-pixi-scipy-2025/cuda-conda
[feature.gpu.dependencies]
# Keep the torch family on conda. conda-forge's PyTorch 2.10 GPU builds require CUDA 12.9.
cuda-version = "==12.9" # retread:pin
cuda-nvcc_linux-64 = "12.9.*"
cuda-toolkit = "12.9.*"
pytorch-gpu = "==2.10.0" # retread:pin
torchvision = "==0.25.0" # retread:pin
torchaudio = "==2.10.0" # retread:pin
imageio = ">=2.37.0,<3"
scikit-image = ">=0.25.2,<0.26"

[feature.gpu.pypi-dependencies]
# Special thank you to @MiroPsota for these wheels
# https://github.com/facebookresearch/pytorch3d/discussions/1752?
pytorch3d = { version = "==0.7.9+d9839a9pt2.10.0cu128", index = "https://miropsota.github.io/torch_packages_builder" }
mujoco = ">=3.3.3"
mujoco-mjx = "*"

#### Unitree RL Gym Environment-----------------------------------------------------------------
