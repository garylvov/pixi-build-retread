schema_version: 1

context:
  name: pixi-build-retread
  version: "4.9.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - path: ..

build:
  number: 0
  # retread is currently released for the two native Linux platforms below.
  # Keep unsupported targets from silently receiving a package containing a
  # binary for the build machine.
  skip:
    - not (target_platform == "linux-64" or target_platform == "linux-aarch64")
  script:
    # v1.2.0+: statically linked against musl so the binary runs on any
    # supported Linux system regardless of glibc version. The conda-forge
    # rust toolchain only ships the glibc std and links against the BUILD
    # HOST's glibc, which produced binaries requiring GLIBC_2.39 that failed
    # on Ubuntu 22.04 (glibc 2.35).
    # conda-forge has no rust-std for *-musl, so we bootstrap the musl
    # target via rustup at build time. Networking inside the sandbox is
    # already a given: git deps (pixi_build_types, uv-pep508,
    # uv-normalize) are fetched at build time too.
    # HOME must match the euid home or rustup-init errors out mid-run and
    # silently skips installing the extra --target (only the default gnu
    # toolchain lands); the cargo build then fails with E0463 "can't find
    # crate for `std`" for *-musl. Keep rustup/cargo state under $SRC_DIR
    # via RUSTUP_HOME/CARGO_HOME, but let HOME be the real one.
    - if: target_platform == "linux-64"
      then: export RETREAD_RUST_TARGET=x86_64-unknown-linux-musl
    - if: target_platform == "linux-aarch64"
      then: export RETREAD_RUST_TARGET=aarch64-unknown-linux-musl
    - test -n "$RETREAD_RUST_TARGET"
    - 'export HOME=$(getent passwd "$(id -u)" | cut -d: -f6)'
    - export RUSTUP_HOME=$SRC_DIR/.rustup CARGO_HOME=$SRC_DIR/.cargo
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
    - sh rustup-init.sh -y --profile minimal --default-toolchain 1.97.0
      --target "$RETREAD_RUST_TARGET" --no-modify-path
    - export PATH=$CARGO_HOME/bin:$PATH
    # Belt and braces: idempotent explicit target add, then a loud check so
    # a missing musl std fails here instead of deep inside the cargo build.
    - rustup target add "$RETREAD_RUST_TARGET"
    - rustup target list --installed | grep -qx "$RETREAD_RUST_TARGET"
    # ring + zstd-sys compile C; point the cc crate at the conda gcc.
    # The objects only reference unversioned libc symbols, so linking
    # them against musl's static libc.a (rust's self-contained mode,
    # the default for *-musl) is sound -- EXCEPT _FORTIFY_SOURCE, which
    # gcc/conda CFLAGS enable by default and which emits glibc-only
    # __memcpy_chk-style symbols musl lacks. Disable it for these objects.
    - export RETREAD_RUST_TARGET_ENV=$(printf '%s' "$RETREAD_RUST_TARGET" | tr '-' '_')
    - export "CC_${RETREAD_RUST_TARGET_ENV}=$CC"
    - export "CFLAGS_${RETREAD_RUST_TARGET_ENV}=-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
    # The conda gcc drives the link and resolves `-ldl` (emitted by the
    # libloading crate) to the conda sysroot's glibc 2.17 libdl.a, whose
    # __dlclose-style internals don't exist under musl. Modern glibc ships
    # libdl/libpthread/librt/etc. as EMPTY stubs (everything lives in
    # libc); musl likewise folds them into libc.a. Shadow the sysroot
    # stubs with empty archives. (GNU ld applies -L paths to every -l
    # regardless of command-line order, so one flag covers them all.)
    - mkdir -p $SRC_DIR/.shimlibs
    - for l in dl pthread rt m util; do ${AR:-ar} rcs $SRC_DIR/.shimlibs/lib$l.a; done
    - export RUSTFLAGS="-L native=$SRC_DIR/.shimlibs"
    # `cargo install` rather than `cargo build` + cp, to avoid a second
    # hardcoded triple in a `cp` path.
    - cargo install --locked --no-track --bin pixi-build-retread --path .
      --target "$RETREAD_RUST_TARGET" --root $PREFIX
    # Fail the build loudly if dynamic linking ever sneaks back in.
    - RETREAD_LDD_OUTPUT=$(ldd $PREFIX/bin/pixi-build-retread 2>&1 || true)
    - printf '%s\n' "$RETREAD_LDD_OUTPUT" | grep -Eq 'statically linked|not a dynamic executable'
    - if readelf -d $PREFIX/bin/pixi-build-retread | grep -qi needed; then
        echo 'ERROR binary has dynamic dependencies' >&2; exit 1; fi
    # A native ARM build must never package an x86 executable (or vice versa).
    - if: target_platform == "linux-64"
      then: readelf -h $PREFIX/bin/pixi-build-retread | grep -Eq 'Machine:.*(Advanced Micro Devices X86-64|X86-64)'
    - if: target_platform == "linux-aarch64"
      then: readelf -h $PREFIX/bin/pixi-build-retread | grep -Eq 'Machine:.*AArch64'

requirements:
  build:
    # C compiler for the cc-rs build scripts (ring, zstd-sys); rust
    # itself comes from rustup (see build script).
    - ${{ compiler('c') }}
    - curl
  ignore_run_exports:
    # The binary is fully static; without this the C compiler's strong
    # run-export would add a pointless libgcc run dep.
    from_package:
      - ${{ compiler('c') }}
  run:
    # The backend shells out to `rattler-build` for the actual conda build.
    - rattler-build >=0.27
    # pixi-build-api-version pins the protocol revision range this binary
    # speaks. API 4 natively (pinned pixi_build_types rev); API 5 (pixi
    # 0.72+) via the src/compat.rs normalization shim that converts the
    # structured conda/build_v1 match specs back to the API-4 string form.
    - pixi-build-api-version >=4,<6
    # uv replaces pip + setuptools + a baked-in python for source builds.
    # `uv pip wheel --python <ver>` downloads python-build-standalone on
    # demand and uses it for the build, so retread itself is
    # python-agnostic: any python the workspace requests just works
    # without rebuilding retread. (Pre-0.11 retread was variant-pinned
    # per python minor and required a retread rebuild for every new
    # python release; uv removes that constraint entirely.)
    - uv >=0.5
    # For [retread-wheels] entries with `git = ...` retread shells out to
    # `git clone`.
    - git

about:
  repository: https://github.com/garylvov/pixi-build-retread
  homepage: https://github.com/garylvov/pixi-build-retread
  summary: |
    Retread PyPI wheels as conda packages, with dep versions loosened
    and shared deps preferred from conda.

    A pixi build backend. Pixi solves conda first, then runs uv against
    PyPI with conda's chosen versions forwarded as hard pins; upstream
    PyPI wheels routinely pin transitives exactly, so those forwarded
    pins clash and the install fails. retread rewrites each exact pin
    to a range in the wheel's METADATA and the emitted conda run-deps,
    and reroutes any shared transitive with a conda equivalent (via
    parselmouth + a small fallback table) onto the conda side before
    uv runs. Deps with no conda equivalent stay bundled in the wheel
    and skip uv entirely.
  license: BSD-3-Clause
  # Inside the build sandbox the parent directory was copied via `source.path = ..`,
  # so the LICENSE file lives at $SRC_DIR/LICENSE.
  license_file: LICENSE
