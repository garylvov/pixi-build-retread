# The source package referenced by `../pixi.toml`'s
# `isaacsim = { path = "..." }`. Repacks the Isaac Sim 5.1 metapackage into a
# single conda source package via retread, following extras to pick up every
# isaacsim-* sub-wheel automatically.

[package]
name = "isaacsim"
version = "5.1.0"

[build]
backend = { name = "pixi-build-retread", version = "*" }
channels = [
  "https://prefix.dev/garylvov",
  "https://prefix.dev/conda-forge",
]

[build.config]
relax = "minor"
build-number = 0

# Same syntax as pixi's `[pypi-dependencies]`. retread resolves this on the
# PEP 503 simple index at `index` and expands `extras` one level deep via
# the wheel's `Requires-Dist: name ; extra == "X"` lines. Compare to the
# 22-line hand-curated URL list in pixi#5230 comment 24.
[build.config.retread-wheels]
isaacsim = { version = "==5.1.0", index = "https://pypi.nvidia.com", extras = ["all", "extscache"] }

# Per-PyPI-name escape hatches. Use these only for cases that minor relax
# cannot resolve. Compare to gigastrap's 16-entry
# [feature.isaaclab.pypi-options.dependency-overrides] block.
[build.config.overrides]
numpy = ">=1.26,<2"

[build.config.name-map]
opencv-python-headless = "py-opencv"
