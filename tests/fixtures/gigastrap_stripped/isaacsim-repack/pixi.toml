# The source package referenced by `../pixi.toml`'s `isaacsim = { path = "..." }`.
# Repacks the Isaac Sim 5.1 wheels into a single conda package via retread.
# Pin sha256s come from `tests/fixtures/*.json`; regenerate with
# tests/fixtures/fetch_metadata.py if NVIDIA republishes.

[package]
name = "isaacsim"
version = "5.1.0"

[build]
backend = { name = "pixi-build-retread", version = "*" }
# During local development, replace the above with:
# backend = { path = "../../../target/release/pixi-build-retread" }
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[build.config]
relax = "minor"
build-number = 0

[[build.config.wheels]]
url = "https://pypi.nvidia.com/isaacsim-kernel/isaacsim_kernel-5.1.0.0-cp311-none-manylinux_2_35_x86_64.whl"
sha256 = "f981290a70ad89f169fb9c47bd55833665677879ebc46ed3992756c617ac02fc"

[[build.config.wheels]]
url = "https://pypi.nvidia.com/isaacsim-core/isaacsim_core-5.1.0.0-cp311-none-manylinux_2_35_x86_64.whl"
sha256 = "cfdd5d82ce455d654c68d37ff4fdd062190e3414289beb6f9b876a10a851b92d"

# Per-PyPI-name escape hatches. Use these only for cases that minor relax
# cannot resolve (e.g. when the upstream pin is plain wrong or when conda
# canonical pins must match exactly). Compare to gigastrap's 16-entry
# [feature.isaaclab.pypi-options.dependency-overrides] block.
[build.config.overrides]
# Keep numpy strictly <2 -- many ros2-jazzy bindings still need it.
numpy = ">=1.26,<2"

[build.config.name-map]
# PyPI ships headless OpenCV under opencv-python-headless; conda calls
# it py-opencv.
opencv-python-headless = "py-opencv"
